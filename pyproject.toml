[project]
name = "python-fundamentals"
version = "0.1.0"
description = "Python fundamentals for civil engineer transitioning to BIM/Construction Tech"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pyright>=1.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "T20", "TCH", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "RSE", "SIM", "TD", "PIE", "TID"]
ignore = ["ANN101", "ANN102", "ANN103", "ARG001", "ARG002", "T201", "T203", "PTH123", "SIM102", "SIM103", "SIM115", "NPY002", "TID251", "TID252", "TID253", "TID254", "TID255", "ERA001"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
